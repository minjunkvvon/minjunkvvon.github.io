<main class="hub" aria-label="Site navigation">
  <svg class="hub-svg" viewBox="0 0 900 640" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10" fill="none" stroke="#fff" stroke-width="1"/>
      </marker>
    </defs>
    <g fill="none" stroke="#fff" stroke-width="1">
      <!-- About <-> Writing (top arc, two-way).
           Nodes are at x=225 and x=675; we pull endpoints in to x=300 / x=600
           so the heads sit clearly to the side of each word. -->
      <path d="M 300,115 Q 450,55 600,115" marker-end="url(#a)"/>
      <path d="M 600,185 Q 450,245 300,185" marker-end="url(#a)"/>

      <!-- About -> name. From below-right of "About" (~285,200) curving to
           upper-left of the name block (~370,295). Center of name is (450,320);
           name half-width ≈ 170, so 370 is just outside the left edge. -->
      <path d="M 285,200 Q 330,250 370,295" marker-end="url(#a)"/>

      <!-- name -> Projects. From lower-right of name (~530,345) to upper-left
           of "Projects" (~615,425). -->
      <path d="M 530,345 Q 575,385 615,425" marker-end="url(#a)"/>

      <!-- Contact ⇢ name (dashed). From upper-right of "Contact" (~285,425) to
           lower-left of name (~370,350). -->
      <path d="M 285,425 Q 330,395 370,350" marker-end="url(#a)" stroke-dasharray="4 4"/>

      <!-- Writing -> Projects (long right arc). From below "Writing" to above
           "Projects", swinging out past x=830. -->
      <path d="M 715,200 Q 830,305 715,415" marker-end="url(#a)"/>

      <!-- About -> Contact (long left arc). Mirror on the left. -->
      <path d="M 185,200 Q 70,305 185,415" marker-end="url(#a)"/>
    </g>
  </svg>
