<script type="module">
import * as THREE from 'three';

const canvas = document.getElementById('earth-canvas');
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 0, 9);
camera.rotation.z = -0.14; // slight roll → limb runs diagonally (STS-26 feel)

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const textureLoader = new THREE.TextureLoader();
const earthTexture = textureLoader.load('assets/earth.jpg');
earthTexture.colorSpace = THREE.SRGBColorSpace;
earthTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();
const bumpTexture = textureLoader.load('assets/earth_bump.jpg');
const specTexture = textureLoader.load('assets/earth_spec.jpg');
specTexture.anisotropy = renderer.capabilities.getMaxAnisotropy();

// STS-26 look = camera close to a BIG sphere so the limb reads as a shallow,
// near-straight diagonal. The MOOD comes from terminator lighting: most of the
// visible disk in shadow, a bright crescent only along the edge.
const EARTH_R = 20;
const earthGeometry = new THREE.SphereGeometry(EARTH_R, 200, 200);
const earthMaterial = new THREE.MeshStandardMaterial({
  map: earthTexture,
  bumpMap: bumpTexture,
  bumpScale: 0.6,
  roughnessMap: specTexture,
  roughness: 0.92,
  metalness: 0,
  color: 0x8896a0   // slight desaturate/darken of the bright Blue Marble
});
const earth = new THREE.Mesh(earthGeometry, earthMaterial);
earth.position.set(2, -(EARTH_R + 1.6), 0);
earth.rotation.z = 0.12;
earth.rotation.y = 2.4;
scene.add(earth);

// ── Atmosphere: a Fresnel rim glow on a slightly larger back-side sphere.
// This thin bright band hugging the limb is the STS-26 signature, and being
// shader-driven it stays razor-sharp at any zoom (unlike the texture).
const atmGeometry = new THREE.SphereGeometry(EARTH_R + 0.22, 200, 200);
const atmMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  transparent: true,
  blending: THREE.AdditiveBlending,
  uniforms: { glowColor: { value: new THREE.Color(0xaec8ff) } },
  vertexShader: `
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      vNormal = normalize(normalMatrix * normal);
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      vView = normalize(-mv.xyz);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 glowColor;
    varying vec3 vNormal;
    varying vec3 vView;
    void main() {
      // Tight rim: high exponent → glow concentrated in a thin line at the limb.
      float d = 1.0 - abs(dot(vNormal, vView));
      float rim = pow(d, 8.0);
      gl_FragColor = vec4(glowColor, rim * 0.85);
    }`
});
const atmosphere = new THREE.Mesh(atmGeometry, atmMaterial);
atmosphere.position.copy(earth.position);
scene.add(atmosphere);

// ── Lighting: low grazing sun → terminator across the visible limb, with a
// bright crescent hugging the edge (the STS-26 glowing band).
const sun = new THREE.DirectionalLight(0xfff1e0, 3.6);
sun.position.set(-5, -0.5, 5);   // grazing, slightly toward camera
scene.add(sun);
scene.add(new THREE.AmbientLight(0x0e1a26, 0.45));  // deep shadow fill

// ── Stars: sparse and subtle. Far fewer, smaller, dimmer, with per-star
// brightness variation so they read as a faint scatter, not a uniform grid.
const starGeometry = new THREE.BufferGeometry();
const starCount = 3200;
const starPositions = new Float32Array(starCount * 3);
const starColors = new Float32Array(starCount * 3);
const starSizes = new Float32Array(starCount);

// Stellar colour temperatures: blue-white (hot) → white → amber (cool).
// Sampled so most stars are white-ish with a minority tinted, like a real sky.
function starColor(out, i) {
  const t = Math.random();
  let r, g, b;
  if (t < 0.10)      { r = 0.74; g = 0.81; b = 1.00; }  // hot blue-white (rare)
  else if (t < 0.30) { r = 0.88; g = 0.92; b = 1.00; }  // blue-white
  else if (t < 0.72) { r = 1.00; g = 0.99; b = 0.96; }  // white (most common)
  else if (t < 0.90) { r = 1.00; g = 0.94; b = 0.84; }  // yellow-white
  else               { r = 1.00; g = 0.85; b = 0.70; }  // amber (cool)
  out[i*3] = r; out[i*3+1] = g; out[i*3+2] = b;
}

for (let i = 0; i < starCount; i++) {
  // Position on a large sphere shell around the camera.
  const r = 60 + Math.random() * 50;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  starPositions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  starPositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  starPositions[i*3+2] = r * Math.cos(phi);

  // Brightness: steep power law → many faint, few bright (like real magnitudes).
  const mag = Math.pow(Math.random(), 4);     // 0 (faint) .. 1 (bright), skewed faint
  const brightness = 0.12 + mag * 0.88;

  // Colour, scaled by brightness so faint stars are dim.
  starColor(starColors, i);
  starColors[i*3]   *= brightness;
  starColors[i*3+1] *= brightness;
  starColors[i*3+2] *= brightness;

  // Size tied to brightness: bright stars render a touch larger.
  starSizes[i] = 1.0 + mag * mag * 4.5;
}

starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
starGeometry.setAttribute('color', new THREE.BufferAttribute(starColors, 3));
starGeometry.setAttribute('aSize', new THREE.BufferAttribute(starSizes, 1));

// Custom shader so each star can have its own size and a soft round falloff.
const starMaterial = new THREE.ShaderMaterial({
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  uniforms: { uPixelRatio: { value: Math.min(window.devicePixelRatio, 2) } },
  vertexShader: `
    attribute float aSize;
    varying vec3 vColor;
    uniform float uPixelRatio;
    void main() {
      vColor = color;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_Position = projectionMatrix * mv;
      // Size attenuates gently with distance.
      gl_PointSize = aSize * uPixelRatio * (300.0 / -mv.z);
    }`,
  fragmentShader: `
    varying vec3 vColor;
    void main() {
      // Soft round star with a bright core and fading halo.
      vec2 d = gl_PointCoord - vec2(0.5);
      float r = length(d);
      if (r > 0.5) discard;
      float core = smoothstep(0.5, 0.0, r);
      float glow = pow(core, 2.2);
      gl_FragColor = vec4(vColor * (0.35 + glow), glow);
    }`,
  vertexColors: true
});
const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);

// ── Satellite: a glowing point tracing a believable orbital pass. A true great
// circle around this giant Earth is far too large for the framing, so we use a
// compact view-space ellipse, oriented to parallel the limb (which runs
// lower-left → upper-right) and positioned so both ends sink behind the Earth.
const earthCenter = earth.position.clone();

// Orbit centre sits just above the limb, toward screen-centre. Tuned via the
// world→screen calibration so the visible arc crosses the viewport.
const orbitCenter = new THREE.Vector3(-0.4, -1.4, -1);
const ORBIT_RX = 6.6;     // long axis (along the limb diagonal)
const ORBIT_RY = 2.2;     // short axis (how far it bows off the limb)
const ORBIT_RZ = 7.0;     // depth swing → far half passes behind the globe
const ORBIT_ROLL = -0.22; // rotate the ellipse to match the limb's diagonal

const cosR = Math.cos(ORBIT_ROLL), sinR = Math.sin(ORBIT_ROLL);

function orbitPoint(angle, out) {
  // Ellipse in the orbit's own plane.
  let lx = Math.cos(angle) * ORBIT_RX;
  let ly = Math.sin(angle) * ORBIT_RY;
  const lz = Math.sin(angle) * ORBIT_RZ;
  // Roll the ellipse in screen-space (x,y) to align with the diagonal limb.
  const rx = lx * cosR - ly * sinR;
  const ry = lx * sinR + ly * cosR;
  out.set(orbitCenter.x + rx, orbitCenter.y + ry, orbitCenter.z + lz);
  return out;
}

// Glowing satellite sprite (soft radial dot drawn to a canvas texture).
// Tightened so it reads as a small steady point, not a comet.
function makeGlowTexture() {
  const s = 64;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  g.addColorStop(0,   'rgba(255,255,255,1)');
  g.addColorStop(0.18,'rgba(225,238,255,0.85)');
  g.addColorStop(0.45,'rgba(150,190,255,0.25)');
  g.addColorStop(1,   'rgba(150,190,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const glowTex = makeGlowTexture();

const satMaterial = new THREE.SpriteMaterial({
  map: glowTex,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  depthTest: true
});
const satellite = new THREE.Sprite(satMaterial);
satellite.scale.set(0.34, 0.34, 0.34);     // small point of light
scene.add(satellite);

// Trail: short and faint — just enough to suggest motion, not a comet tail.
const TRAIL_LEN = 26;
const trailGeometry = new THREE.BufferGeometry();
const trailPositions = new Float32Array(TRAIL_LEN * 3);
const trailColors = new Float32Array(TRAIL_LEN * 3);
trailGeometry.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
trailGeometry.setAttribute('color', new THREE.BufferAttribute(trailColors, 3));
const trailMaterial = new THREE.PointsMaterial({
  size: 0.09,
  sizeAttenuation: true,
  vertexColors: true,
  transparent: true,
  opacity: 0.6,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const trail = new THREE.Points(trailGeometry, trailMaterial);
scene.add(trail);

// Pre-fill the trail along the orbit behind the start angle.
let satAngle = 0;
const ORBIT_SPEED = 0.0034;               // radians/frame (~30s per orbit @60fps)
const TRAIL_STEP = 0.010;                 // angular spacing between trail points
const _p = new THREE.Vector3();
function initTrail() {
  for (let i = 0; i < TRAIL_LEN; i++) {
    orbitPoint(satAngle - i * TRAIL_STEP, _p);
    trailPositions[i*3] = _p.x; trailPositions[i*3+1] = _p.y; trailPositions[i*3+2] = _p.z;
    const t = 1 - i / TRAIL_LEN;           // brightness fades toward tail
    const b = t * t * 0.7;
    trailColors[i*3] = b * 0.8; trailColors[i*3+1] = b * 0.88; trailColors[i*3+2] = b;
  }
  trailGeometry.attributes.position.needsUpdate = true;
  trailGeometry.attributes.color.needsUpdate = true;
}
initTrail();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

function animate() {
  requestAnimationFrame(animate);
  if (!reduceMotion) {
    earth.rotation.y += 0.0006;
    stars.rotation.y += 0.00008;

    // Advance satellite along its orbit.
    satAngle += ORBIT_SPEED;
    orbitPoint(satAngle, _p);
    satellite.position.copy(_p);

    // Shift trail points back by one and write the new head position.
    for (let i = TRAIL_LEN - 1; i > 0; i--) {
      trailPositions[i*3]   = trailPositions[(i-1)*3];
      trailPositions[i*3+1] = trailPositions[(i-1)*3+1];
      trailPositions[i*3+2] = trailPositions[(i-1)*3+2];
    }
    trailPositions[0] = _p.x; trailPositions[1] = _p.y; trailPositions[2] = _p.z;
    trailGeometry.attributes.position.needsUpdate = true;
  }
  renderer.render(scene, camera);
}
animate();
</script>
